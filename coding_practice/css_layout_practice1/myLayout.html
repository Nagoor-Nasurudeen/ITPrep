<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Designer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex-container">
        <div class="card">
            <div class="imgdiv" style="position: relative;">
                <img id="photo" src="nasir.jpg" alt="Nasurudeen" height="100%" width="100%"  >
                <button class="savebtn" style="position: absolute;top:3px;right: 3px;"><img src="assets/save.png" alt="save" height="20px" width="20px"></button>
            </div>
            <h2>Nagoor Nasurudeen <img src="assets/verificationbadge.png" alt="verified" height="25px" width="25px"></h2>
            <p>I'm a brand Designer who focuses on clarity
                 & emotional connection</p>
            <div class="statistics">
                <p>⭐ <b>5.0</b> <br>Rating</p>
                <div class="separator"></div>
                <p><b>$45k +</b> <br>Earned</p>
                <div class="separator"></div>
                <p><b>$50/hr</b><br> Rate</p>
            </div>
            <button class="getInTouch" style="width: 100%;"><img src="assets/mailwhite.png" alt="mail" height="25px" width="25px" style="vertical-align: middle;"> Get in touch</button>
        </div>

        <div class="card" >
            <div class="card2-wrapper" style="position: relative; flex-grow: 1;">
                <img src="nasir-full.jpg" alt="Nasurudeen" height="100%" width="100%" style="anchor-name: --card2-anchor;">
                <div class="card2">
                    <h2>Nagoor Nasurudeen <img src="assets/verificationbadge.png" alt="verified" height="25px" width="25px"></h2>
                    <p>I'm a brand Designer who focuses on clarity
                        & emotional connection</p>
                    <div class="statistics">
                        <p>⭐ <b>5.0</b> <br>Rating</p>
                        <div class="separator"></div>
                        <p><b>$45k +</b> <br>Earned</p>
                        <div class="separator"></div>
                        <p><b>$50/hr</b><br> Rate</p>
                    </div>
                    <div class="buttons">
                        <button class="getInTouch" style="background-color: white;color: black;"><img src="assets/mail.png" alt="mail" height="27px" width="27px" style="vertical-align: middle;"> Get in touch</button><button class="savebtn"><img src="assets/save.png" alt="save" height="20px" width="20px"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
